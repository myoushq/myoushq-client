[package]
name = "myous-desktop"
version = "0.7.0"
description = "myous for Linux and Windows: the human's side of a worker on this computer"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "myous_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
trash = "5"
hostname = "0.4"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Tauri builds it with this feature already; listed so the app doesn't rely on that.
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
