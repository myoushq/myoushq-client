[package]
name = "myous-desktop"
version = "0.8.2"
description = "myous for Linux and Windows: the human's side of a worker on this computer"
edition = "2021"
rust-version = "1.80"
license = "MIT"
publish = false

[lib]
name = "myous_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
trash = "5"
hostname = "0.4"

# Opening files in a worker's folder without following links (O_NOFOLLOW;
# files.rs). In the lock already (other crates use it): nothing new builds.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# Tauri builds it with this feature already; listed so the app doesn't rely on that.
windows = { version = "0.62", features = ["Win32_UI_Shell"] }

# A Mac, as myous for Mac has them: notifications with Allow and Refuse
# (UserNotifications), open at login through SMAppService (auto-launch,
# the autostart plugin's own crate), and the worker's browser found,
# hidden and shown through AppKit (browser.rs's mac). All are in the lock
# already, at these versions, and the features are ones the tree turns on
# anyway (default features off for the same reason), so nothing else
# builds again (objc2-user-notifications builds once for a Mac).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSError", "NSSet", "NSString", "NSURL"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSRunningApplication", "NSWorkspace"] }
objc2-user-notifications = { version = "0.3.2", default-features = false, features = ["std", "block2", "bitflags", "UNNotification", "UNNotificationAction", "UNNotificationCategory", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger", "UNUserNotificationCenter"] }
auto-launch = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
