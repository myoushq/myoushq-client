# Publishes a release from a tag signed with the myoushq release key.
#
# Nothing here can publish unless the tag's signature verifies against the
# release key: the key is pinned by fingerprint below, so even a compromised
# repository can't swap the allowed-signers file. Registries are reached
# with their trusted publishing (OpenID Connect, no stored tokens); the
# macOS app is signed and notarized with the owner's Apple credentials from
# repository secrets. Every publishing step is idempotent, so the workflow
# can be re-run for a tag (workflow_dispatch) after a registry is set up.
#
# One-time setup, by the owner, is described in RELEASING.md.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Signed release tag to publish, e.g. v0.4.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  RELEASE_KEY_FINGERPRINT: SHA256:PevPZ8ORUnoGw3hg9Febw7KjXxCUv+sMkAXzw+rjQuk
  IMAGE: ghcr.io/myoushq/worker

jobs:
  verify:
    name: verify the tag's signature
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-tags: true
      - name: verify against the pinned release key
        run: |
          set -eu
          cut -d' ' -f3- docs/allowed_signers | ssh-keygen -lf - | grep -q "$RELEASE_KEY_FINGERPRINT" \
            || { echo "docs/allowed_signers does not hold the release key $RELEASE_KEY_FINGERPRINT" >&2; exit 1; }
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=docs/allowed_signers verify-tag "$TAG"
      - id: v
        name: version from the tag, checked against the sources
        run: |
          set -eu
          version=${TAG#v}
          grep -q "^version = \"$version\"" python/pyproject.toml || { echo "python/pyproject.toml is not $version" >&2; exit 1; }
          grep -q "\"version\": \"$version\"" typescript/package.json || { echo "typescript/package.json is not $version" >&2; exit 1; }
          grep -q "^version = \"$version\"" rust/Cargo.toml || { echo "rust/Cargo.toml is not $version" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test-python:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: |
          pip install --require-hashes -r python/requirements.lock
          pip install --no-deps python/
          # Tests that need the hub skip without its source.
          python -m unittest discover -s python/tests -p '*_test.py'

  test-go:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go/go.mod }
      - run: cd go && go vet ./... && go test ./...

  test-rust:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cd rust && cargo test --locked -p myous-pake -p myous

  test-typescript:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - name: pairing crypto as WebAssembly
        run: |
          cargo install --locked wasm-bindgen-cli --version 0.2.129
          sh rust/wasm/build.sh
      - run: cd typescript && npm ci && npm run build && npm test

  audit:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: go/go.mod }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cd typescript && npm ci
      - run: CARGO=cargo sh scripts/audit.sh

  pypi:
    name: publish to PyPI
    needs: [verify, test-python, audit]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: pip install build==1.3.0 && python -m build --outdir dist python
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: dist
          skip-existing: true

  npm:
    name: publish to npm
    needs: [verify, test-typescript, audit]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: pairing crypto as WebAssembly
        run: |
          cargo install --locked wasm-bindgen-cli --version 0.2.129
          sh rust/wasm/build.sh
      - run: cd typescript && npm ci && npm run build
      - name: stage for publishing (the owner promotes it on npmjs.com with 2FA)
        run: |
          set -eu -o pipefail
          npm install -g npm@11   # trusted and staged publishing need a recent CLI
          cd typescript
          version=${{ needs.verify.outputs.version }}
          if npm view "myous@$version" version >/dev/null 2>&1; then
            echo "myous@$version is already on npm"; exit 0
          fi
          # A version that is staged but not yet promoted can't be staged
          # again; that's done, not a failure.
          if ! npm stage publish --access public --provenance 2>&1 | tee /tmp/npm.log; then
            grep -q "previously published version" /tmp/npm.log && { echo "myous@$version is already staged"; exit 0; }
            exit 1
          fi

  crates:
    name: publish to crates.io
    needs: [verify, test-rust, audit]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1
        id: auth
      - name: publish myous-pake, then myous (cargo waits for the index between them)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -eu
          cd rust
          version=${{ needs.verify.outputs.version }}
          for crate in myous-pake myous; do
            if curl -fsS "https://crates.io/api/v1/crates/$crate/$version" -H "User-Agent: myoushq-release" >/dev/null 2>&1; then
              echo "$crate $version is already on crates.io"; continue
            fi
            cargo publish --locked -p "$crate"
          done

  image:
    name: worker image (${{ matrix.arch }})
    needs: [verify, test-python, audit]
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    outputs:
      digest-amd64: ${{ steps.out.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.out.outputs.digest-arm64 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: worker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/myoushq/myoushq-client
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - id: out
        run: echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  image-manifest:
    name: worker image tags and signature
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: one multi-arch image, tagged vX.Y.Z, X.Y.Z (what the Mac app pulls) and latest, signed
        run: |
          set -eu
          docker buildx imagetools create -t "$IMAGE:$TAG" -t "$IMAGE:${{ needs.verify.outputs.version }}" -t "$IMAGE:latest" \
            "$IMAGE@${{ needs.image.outputs.digest-amd64 }}" "$IMAGE@${{ needs.image.outputs.digest-arm64 }}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          cosign sign --yes "$IMAGE@$digest"
          echo "signed $IMAGE@$digest"

  mac-app:
    name: macOS app (signed and notarized when the secrets exist)
    needs: [verify, test-python]
    runs-on: macos-14
    env:
      HAVE_CERT: ${{ secrets.MAC_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - name: import the Developer ID certificate into a throwaway keychain
        if: env.HAVE_CERT == 'true'
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -eu
          echo "$MAC_CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          # codesign only searches keychains on the search list; being the
          # default keychain isn't enough.
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          rm /tmp/cert.p12
          security find-identity -v -p codesigning build.keychain
      - name: build and sign
        env:
          MAC_SIGN_IDENTITY: ${{ secrets.MAC_SIGN_IDENTITY }}
        run: |
          set -eu
          cd worker/mac
          if [ "$HAVE_CERT" = true ]; then
            # The identity as the keychain names it; the secret is a fallback.
            identity=$(security find-identity -v -p codesigning build.keychain | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')
            identity=${identity:-$MAC_SIGN_IDENTITY}
            [ -n "$identity" ] || { echo "no Developer ID Application identity in the keychain" >&2; exit 1; }
            echo "signing as $identity"
            echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
            ./make-app.sh --no-config --version "${{ needs.verify.outputs.version }}" --sign "$identity"
          else
            ./make-app.sh --no-config --version "${{ needs.verify.outputs.version }}"
          fi
      - name: notarize and staple
        if: env.HAVE_CERT == 'true'
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          set -eu
          echo "$NOTARY_KEY" | base64 --decode > /tmp/notary.p8
          worker/mac/notarize.sh "worker/mac/build/Myous Worker.app" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER_ID" --key /tmp/notary.p8
          rm /tmp/notary.p8
      - name: disk image and checksum
        run: |
          set -eu
          mkdir -p out
          if [ "$HAVE_CERT" = true ]; then
            worker/mac/make-dmg.sh "worker/mac/build/Myous Worker.app" "out/Myous-Worker-$TAG.dmg" --sign "$SIGN_IDENTITY"
          else
            worker/mac/make-dmg.sh "worker/mac/build/Myous Worker.app" "out/Myous-Worker-$TAG.dmg"
          fi
          (cd out && shasum -a 256 *.dmg > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mac-app
          path: out/

  github-release:
    name: GitHub release
    needs: [verify, test-python, test-go, test-rust, test-typescript, audit, mac-app]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { ref: "refs/tags/${{ env.TAG }}" }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: mac-app
          path: out
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - name: source packages and checksums
        run: |
          set -eu
          pip install build==1.3.0 && python -m build --outdir out python
          cp python/requirements.lock out/requirements-python.lock
          scripts/release-notes.sh "$TAG" > out/notes.md
          (cd out && shasum -a 256 *.dmg *.whl *.tar.gz *.lock > SHA256SUMS)
          cat out/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.TAG }}
          name: myous ${{ env.TAG }}
          body_path: out/notes.md
          files: |
            out/*.dmg
            out/*.whl
            out/*.tar.gz
            out/requirements-python.lock
            out/SHA256SUMS
