# Tests and dependency audit on every push and pull request. Tests that
# need the hub (end to end, cross-language) skip here: the hub lives in the
# private repository. Run them locally before tagging (RELEASING.md).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: |
          pip install --require-hashes -r python/requirements.lock
          pip install --no-deps python/
          python -m unittest discover -s python/tests -p '*_test.py'
      # The Claude Code hook script (its real-client half needs the hub and skips here).
      - run: PYTHON=python bash examples/claude-code/test.sh
  python-windows:
    # The parts that differ on Windows: the worker's shell (PowerShell),
    # stopping a command with what it started, pid checks, file locks and
    # the review hook (myous for Windows runs the worker without a
    # container where there is no WSL 2).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: |
          pip install --require-hashes -r python/requirements.lock
          pip install --no-deps python/
          cd python && python -m unittest tests.processes_test tests.review_hook_test tests.cron_test tests.hook_script_test -v
      # The Claude Code hook for Windows, under Windows PowerShell 5.1 and PowerShell 7.
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File examples/claude-code/test.ps1
      - run: pwsh -NoProfile -File examples/claude-code/test.ps1
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # setup-go 6 installs the Go of go.mod's toolchain line (from GitHub,
      # not through the go command, whose download flaked) and sets
      # GOTOOLCHAIN=local for the rest of the job; every job here does so.
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - run: cd go && go vet ./... && go test -race ./... && GOOS=windows go vet ./...
      # The tests that need a hub (the Go integration tests, the Python
      # end-to-end tests with each worker, interop) skip here: the hub is
      # private. They run in the private repo's hub-tests workflow, which
      # checks this repo out.
  go-windows:
    # The Go worker's Windows side, as python-windows checks the Python
    # one: PowerShell, stopping a command with what it started, the review
    # (hook under cmd.exe, PowerShell's read-only list), file locks.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - run: cd go && go test -short -v -run 'Worker|Shell|Review|Shlex|PyJSON|Lock|EncodedCommand|Windows' .
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      # Dependencies' build output from main's last run (rust-cache cleans out
      # the workspace's own crates). Saved from main only: pull requests restore
      # it but don't fill the repository's 10 GB with entries of their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cd rust && cargo test --locked -p myous-pake -p myous
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { targets: wasm32-unknown-unknown }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: rust
          shared-key: wasm
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - run: |
          cargo install --locked wasm-bindgen-cli --version 0.2.129
          sh rust/wasm/build.sh
          cd typescript && npm ci && npm run build && npm test
  desktop-app-linux:
    # myous for Linux: Tauri 2 (Rust) with the window in the system
    # WebKitGTK. Built on the oldest supported Ubuntu, so the AppImage
    # runs on older glibc too. The window's screens are rendered in a
    # headless browser from made-up data, which fails on any script error.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker/desktop/src-tauri
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - name: system libraries for Tauri
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev build-essential file
      # The Go worker the app carries for running without a container
      # (Tauri's externalBin: the Rust build needs it in place).
      - run: sh worker/build-worker.sh x86_64-unknown-linux-gnu worker/desktop/src-tauri/binaries "$(node -p 'require("./worker/desktop/package.json").version')"
      - run: cd worker/desktop && npm ci && npm test && npm run build:ui
      # Formatting is the same everywhere. Clippy runs on Windows and the
      # Mac (below), not yet here: it hasn't been checked warning-free for
      # Linux's cfg.
      - run: cd worker/desktop/src-tauri && cargo fmt --check
      - run: cd worker/desktop/src-tauri && cargo test -- --nocapture
      - name: every screen renders
        run: |
          pip install -q playwright==1.55.0 && python -m playwright install --with-deps chromium-headless-shell
          cd worker/desktop && python screens.py /tmp/screens
      - name: the first-launch buttons do what they say
        run: cd worker/desktop && python clicks.py
      - run: cd worker/desktop && npx tauri build --bundles appimage,deb
      # The built bundles start and show their window on a virtual display
      # (worker/desktop/smoke: the same script run.sh runs in Docker).
      - name: the AppImage opens its window (Xvfb)
        run: |
          sudo apt-get install -y -qq --no-install-recommends xvfb x11-utils imagemagick xdotool dbus-x11
          mkdir -p /tmp/smoke && cd /tmp/smoke
          "$(ls "$GITHUB_WORKSPACE"/worker/desktop/src-tauri/target/release/bundle/appimage/*.AppImage)" --appimage-extract >/dev/null
          APP=/tmp/smoke/squashfs-root/AppRun OUT=/tmp/smoke/out TAG=appimage SHOTS="3 10" CLICK="533 349" \
            bash "$GITHUB_WORKSPACE/worker/desktop/smoke/smoke.sh"
      - name: the .deb installs and starts
        run: |
          sudo apt-get install -y -qq ./worker/desktop/src-tauri/target/release/bundle/deb/*.deb
          dpkg -L myous | grep -qx /usr/bin/myous-desktop
          APP=/usr/bin/myous-desktop OUT=/tmp/smoke/out TAG=deb SHOTS=10 XDISPLAY=98 \
            bash worker/desktop/smoke/smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: linux-smoke, path: /tmp/smoke/out/, if-no-files-found: ignore }
  desktop-app-windows:
    # myous for Windows: the same app, built on Windows (WebView2), with
    # the NSIS installer that fetches WebView2 if the PC lacks it.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker/desktop/src-tauri
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - run: sh worker/build-worker.sh x86_64-pc-windows-msvc worker/desktop/src-tauri/binaries "$(node -p 'require("./worker/desktop/package.json").version')"
        shell: bash
      - run: cd worker/desktop && npm ci && npm test && npm run build:ui
      - run: cd worker/desktop/src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cd worker/desktop/src-tauri && cargo test -- --nocapture
      - run: cd worker/desktop && npx tauri build --bundles nsis
  mac-app:
    # myous for Mac: the same app (worker/desktop) built on macOS as the
    # release builds it, universal (both Rust targets, the worker for each
    # joined with lipo), so a push of main proves that build before a tag
    # does; signed ad hoc instead of with the Developer ID, and packed into
    # a disk image with worker/mac's script. About 30 minutes.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with: { targets: "aarch64-apple-darwin,x86_64-apple-darwin", components: "clippy, rustfmt" }
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: worker/desktop/src-tauri
          shared-key: desktop
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - run: sh worker/build-worker.sh host worker/desktop/src-tauri/binaries "$(node -p 'require("./worker/desktop/package.json").version')"
      - run: cd worker/desktop && npm ci && npm test && npm run build:ui
      - run: cd worker/desktop/src-tauri && cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - run: cd worker/desktop/src-tauri && cargo test -- --nocapture
      - run: cd worker/desktop && ./make-mac.sh --universal
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with: { go-version-file: go/go.mod, cache-dependency-path: go/go.sum }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: "22" }
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
      - run: cd typescript && npm ci
      - run: CARGO=cargo sh scripts/audit.sh
