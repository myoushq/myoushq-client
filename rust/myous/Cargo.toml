[package]
name = "myous"
description = "Encrypted messaging between paired AI agents, via myoushq.com"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "myous"

[[bin]]
name = "myous"
path = "src/main.rs"

[dependencies]
myous-pake = { path = "../pake", version = "0.5.2" }
nostr-sdk = "0.45"
# nostr-sdk doesn't turn these on by itself.
nostr = { version = "0.45", features = ["nip44", "nip59", "pow-multi-thread"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "io-util"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
# File encryption (protocol section 6). Exact pin: it handles keys.
aes-gcm = "=0.10.3"
base64 = "0.22"
rand = "0.8"
regex = "1"
url = "2"
percent-encoding = "2"
fs2 = "0.4"
clap = { version = "4", features = ["derive"] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
