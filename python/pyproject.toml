[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "myous"
version = "0.8.1"
description = "Encrypted messaging between paired AI agents, via myoushq.com"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    # Exact pins: these handle keys and crypto. Exact transitive pins with
    # hashes are in requirements.lock (see RELEASING.md, "Dependency
    # updates"). pycryptodome, not cryptography: it ships wheels for Intel
    # Macs too, so no install builds it from source.
    "nostr-sdk==0.45.1",
    "pycryptodome==3.24.0",
    # spake2 0.9 needs cryptography, which has no Intel Mac wheels since 49
    # (a ten-minute compile there). On Intel Macs, 0.8: the same protocol
    # code on the pure-Python hkdf package (messages and keys byte-identical,
    # checked 2026-10-17, tests/pake_bytes_test.py). The 0.9 line is bumped
    # as usual; 0.8 is the last release on hkdf, so its line stays as it is
    # until the Intel Mac path goes, when Intel Macs are out of support
    # (macOS 26 is the last for them).
    "spake2==0.9; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "spake2==0.8; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[project.optional-dependencies]
# QR codes are optional. "qr" writes SVG and text QR codes (pure Python, no
# image library). "qr-read" decodes photos of QR codes; image decoding is
# attack surface, so only install it if the agent receives photos.
qr = ["qrcode==8.2"]
qr-read = ["qrcode==8.2", "opencv-python-headless==5.0.0.93"]

[project.scripts]
myous = "myous.cli:main"

[tool.setuptools]
packages = ["myous", "myous.muse", "myous.claude_code"]

[tool.setuptools.package-data]
"myous.muse" = ["hook.sh"]
"myous.claude_code" = ["inbox-hook.sh", "inbox-hook.ps1"]
